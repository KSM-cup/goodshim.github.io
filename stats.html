<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>굿쉼 공원 운영 현황</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Operator view: one olive card per question — 몇 명 왔나 → 쉬어 봤나 → 신청했나 */
:root{
  --olive:#5E6B2D; --olive-dark:#3E4A1A; --cream:#F3EFDC; --paper:#FBF8EC; --ink:#2B3312; --muted:#6b6a52;
  --line:rgba(94,107,45,.18); --warm:#C9782F; --bar:#A7BB72;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif; --body:"Gowun Dodum",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --cream:#1f2414; --paper:#283019; --ink:#eef0de; --muted:#b9bb9c; --olive:#b8c66a; --olive-dark:#dfe7a8; --line:rgba(184,198,106,.22); --warm:#f0a35a; --bar:#7f9446; color-scheme:dark } }
:root[data-theme="dark"]{ --cream:#1f2414; --paper:#283019; --ink:#eef0de; --muted:#b9bb9c; --olive:#b8c66a; --olive-dark:#dfe7a8; --line:rgba(184,198,106,.22); --warm:#f0a35a; --bar:#7f9446; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;color:var(--olive-dark);text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;min-width:0}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:18px;color:var(--olive-dark)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:0;border-radius:999px;padding:7px 14px;font:15px var(--body);background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--olive);color:var(--cream);box-shadow:none}
.tabs button:focus-visible,#gate button:focus-visible,#code:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.funnel{display:grid;gap:10px}
.step{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;align-items:center;gap:10px}
.step .lab{font-size:14px;color:var(--muted)}
.step .track{height:16px;border-radius:999px;background:var(--line);overflow:hidden}
.step .fill{height:100%;border-radius:999px;background:var(--bar);width:0;transition:width .5s ease}
.step.goal .fill{background:var(--olive)}
.step .num{font-family:var(--display);font-size:20px;color:var(--olive-dark);min-width:2.5em;text-align:right}
.rate{font-size:13px;color:var(--muted)}
.rate b{color:var(--warm);font-weight:400;font-family:var(--display);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:2px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:24px;color:var(--olive-dark)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:.03em}
#gate{max-width:340px;margin:12vh auto 0;display:grid;gap:12px;text-align:center}
#gate input{font:20px var(--display);letter-spacing:.3em;text-align:center;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
#gate button{border:0;border-radius:999px;padding:12px;background:var(--olive);color:var(--cream);font:16px var(--display);cursor:pointer}
.err{color:var(--warm);font-size:14px;min-height:1.2em;margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <h1>운영자 확인</h1>
  <p class="sub">굿쉼 공원 현황은 운영자만 볼 수 있어요.</p>
  <label for="code" class="sub">확인 번호 6자리</label>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="off">
  <button type="submit">들어가기</button>
  <p class="err" id="gateErr" aria-live="polite"></p>
</form>

<main class="wrap" id="app" hidden>
  <header>
    <h1>굿쉼 공원 운영 현황</h1>
    <p class="sub" id="updated">불러오는 중…</p>
  </header>

  <div class="tabs" role="group" aria-label="기간">
    <button type="button" data-r="today" aria-pressed="false">오늘</button>
    <button type="button" data-r="7" aria-pressed="true">최근 7일</button>
    <button type="button" data-r="30" aria-pressed="false">최근 30일</button>
    <button type="button" data-r="all" aria-pressed="false">전체</button>
  </div>

  <section class="card" aria-labelledby="fT">
    <h2 id="fT">방문 → 쉼 체험 → 모임 신청</h2>
    <div class="funnel" id="funnel"></div>
    <p class="rate" id="rates"></p>
  </section>

  <section class="card" aria-labelledby="dT">
    <h2 id="dT">자세히</h2>
    <div class="grid" id="tiles"></div>
  </section>

  <section class="card" aria-labelledby="tT">
    <h2 id="tT">날짜별</h2>
    <div class="scroll"><table id="days"><thead><tr><th>날짜</th><th>방문</th><th>체험 완료</th><th>신청 클릭</th><th>DM</th><th>사진</th></tr></thead><tbody></tbody></table></div>
    <p class="note">날짜별 기록은 이 페이지를 만든 날부터 쌓여요. '전체'에는 그 전 기록도 들어 있어요.</p>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
var CONFIG={apiKey:"AIzaSyBaqUxHLALHqOOnkWyroCMuVDFAd64mjxs", authDomain:"goodshim-park.firebaseapp.com",
  databaseURL:"https://goodshim-park-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"goodshim-park", appId:"1:715447753929:web:7dcbb4353ed6a4d5a64118"};
var ROOM='goodshim-park';
var PASS_HASH='8fc734576cf8176424e475a144f18661673873f6fb04df1d1034b4463ef35516';   /* sha-256 of 'goodshim:' + 확인 번호 */
var $=function(id){ return document.getElementById(id); };
var TOTAL={}, DAYS={}, range='7';

function sha(t){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b),function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); }); }
function open(){ $('gate').hidden=true; $('app').hidden=false; start(); }
try{ if(sessionStorage.getItem('gs-ok')==='1'){ open(); } }catch(e){}
$('gate').addEventListener('submit', function(e){
  e.preventDefault();
  var c=($('code').value||'').trim();
  if(!window.crypto || !crypto.subtle){ $('gateErr').textContent='이 브라우저에서는 확인할 수 없어요.'; return; }
  sha('goodshim:'+c).then(function(h){
    if(h===PASS_HASH){ try{ sessionStorage.setItem('gs-ok','1'); }catch(e){} open(); }
    else $('gateErr').textContent='번호가 맞지 않아요.';
  });
});

function dayKey(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function sumKeys(o,keys){ var n=0; keys.forEach(function(k){ n+=+(o&&o[k])||0; }); return n; }
var APPLY=['apply_card','apply_notice','apply_pill'], DM=['dm_card','dm_booth'], PHOTO=['photo'];
function pick(){
  if(range==='all') return TOTAL;
  var n=range==='today'?1:+range, out={}, d=new Date();
  for(var i=0;i<n;i++){ var k=dayKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()-i)), v=DAYS[k]||{}; Object.keys(v).forEach(function(x){ out[x]=(out[x]||0)+(+v[x]||0); }); }
  return out;
}
function render(){
  var o=pick(), visits=+o.visits||0, done=+o.quest_done||0, apply=sumKeys(o,APPLY), dm=sumKeys(o,DM);
  var steps=[['들어온 사람',visits,false],['쉼 체험 완료',done,false],['모임 신청 클릭',apply,true]], max=Math.max(1,visits,done,apply);
  var f=$('funnel'); f.textContent='';
  steps.forEach(function(st){
    var row=document.createElement('div'); row.className='step'+(st[2]?' goal':'');
    var l=document.createElement('span'); l.className='lab'; l.textContent=st[0];
    var t=document.createElement('div'); t.className='track'; var fi=document.createElement('div'); fi.className='fill'; t.appendChild(fi);
    var n=document.createElement('span'); n.className='num'; n.textContent=st[1].toLocaleString('ko-KR');
    row.appendChild(l); row.appendChild(t); row.appendChild(n); f.appendChild(row);
    requestAnimationFrame(function(){ fi.style.width=(st[1]/max*100)+'%'; });
  });
  function pct(a,b){ return b? Math.round(a/b*100)+'%' : '–'; }
  $('rates').innerHTML='';
  var r=$('rates');
  [['체험 완료율 ',pct(done,visits)],[' · 신청 전환율 ',pct(apply,visits)],[' · DM 문의 ',dm.toLocaleString('ko-KR')+'건']].forEach(function(p){ r.appendChild(document.createTextNode(p[0])); var b=document.createElement('b'); b.textContent=p[1]; r.appendChild(b); });
  var tiles=[['책 펼치기',o.quest_read],['하늘 보며 숨 고르기',o.quest_sky],['소원 동전',o.quest_wish],['모닥불 둘러앉기',o.quest_fire],['군고구마',o.potato],['마시멜로',o.mallow],
    ['신청 카드에서 신청',o.apply_card],['게시판에서 신청',o.apply_notice],['DM (신청 카드)',o.dm_card],['DM (전화부스)',o.dm_booth],['사진 찍기',o.photo],['사진 공유',o.photo_share]];
  var g=$('tiles'); g.textContent='';
  tiles.forEach(function(t){ var d=document.createElement('div'); d.className='tile'; var k=document.createElement('span'); k.className='k'; k.textContent=t[0]; var v=document.createElement('span'); v.className='v'; v.textContent=(+t[1]||0).toLocaleString('ko-KR'); d.appendChild(k); d.appendChild(v); g.appendChild(d); });
  var tb=document.querySelector('#days tbody'); tb.textContent='';
  Object.keys(DAYS).sort().reverse().slice(0,30).forEach(function(k){
    var v=DAYS[k]||{}, tr=document.createElement('tr');
    [k.slice(5).replace('-','/'), +v.visits||0, +v.quest_done||0, sumKeys(v,APPLY), sumKeys(v,DM), sumKeys(v,PHOTO)].forEach(function(c){ var td=document.createElement('td'); td.textContent=typeof c==='number'?c.toLocaleString('ko-KR'):c; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  if(!tb.firstChild){ var tr=document.createElement('tr'), td=document.createElement('td'); td.colSpan=6; td.textContent='아직 날짜별 기록이 없어요.'; tr.appendChild(td); tb.appendChild(tr); }
}
Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
  b.addEventListener('click', function(){ range=b.dataset.r; Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); }); render(); });
});
var started=false;
function start(){
  if(started) return; started=true;
  if(!window.firebase){ $('updated').textContent='데이터를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
  var db=firebase.database(firebase.initializeApp(CONFIG)), base='rooms/'+ROOM;
  db.ref(base+'/stats').on('value', function(s){ TOTAL=s.val()||{}; stamp(); render(); }, function(){ $('updated').textContent='불러오기 권한이 없어요. Firebase 규칙을 확인해 주세요.'; });
  db.ref(base+'/statsDay').limitToLast(60).on('value', function(s){ DAYS=s.val()||{}; stamp(); render(); }, function(){});
}
function stamp(){ var d=new Date(); $('updated').textContent='실시간 · '+d.getHours()+'시 '+('0'+d.getMinutes()).slice(-2)+'분 기준'; }
})();
</script>
</body>
</html>
